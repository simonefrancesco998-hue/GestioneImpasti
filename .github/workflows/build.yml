name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q "$(ls *.zip | head -n1)" -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: src/CalcoloImpasti
      - uses: actions/upload-artifact@v4
        with:
          name: CalcoloImpasti-apk
          path: src/CalcoloImpasti/app/build/outputs/apk/debug/app-debug.apk
